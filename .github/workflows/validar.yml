name: Validar circuito

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Robô do desafio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Qiskit
        run: pip install "qiskit>=2.0"

      - name: Validar o circuito do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTOR_PR: ${{ github.event.pull_request.user.login }}
        run: python scripts/validar_pr.py --base "$BASE_SHA" --login "$AUTOR_PR"
